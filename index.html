<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snes' Foto-Stube</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><a href="index.html">Snes' Foto-Stube</a></h1>
    <nav id="main-nav">
      <a href="index.html">Start</a>
      <a href="galerie.html">Galerie</a>
      <a href="about.html">Was ist das hier?</a>
      <a href="impressum.html">Impressum</a>
      <button id="toggle-darkmode">Dark Mode an/aus</button>
    </nav>
  </header>

  <main>
    <!-- Slideshow -->
    <section class="slideshow">
      <div class="slide active">
        <img src="bilder/IMG_20250928_0014.jpg" alt="Bild 1">
      </div>
      <div class="slide">
        <img src="bilder/IMG_20250928_0020.jpg" alt="Bild 2">
      </div>
      <div class="slide">
        <img src="bilder/IMG_20250928_0021.jpg" alt="Bild 3">
      </div>
      <!-- weitere Slides hier -->
      <span class="prev">&#10094;</span>
      <span class="next">&#10095;</span>
    </section>
  </main>

  <script>
    // ==============================
    // Dark Mode & Scroll Nav
    // ==============================
    const toggleBtn = document.getElementById('toggle-darkmode');
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      });
    }

    let lastScrollTop = 0;
    const nav = document.getElementById('main-nav');
    if (nav) {
      window.addEventListener('scroll', () => {
        let st = window.pageYOffset || document.documentElement.scrollTop;
        if (st > lastScrollTop && st > 50) {
          nav.classList.add('hidden');
        } else {
          nav.classList.remove('hidden');
        }
        lastScrollTop = st <= 0 ? 0 : st;
      });
    }

    // ==============================
    // Slideshow
    // ==============================
    let slideIndex = 0;
    const slides = document.querySelectorAll('.slide');

    function showSlide(index) {
      if (!slides.length) return;
      slides.forEach(slide => slide.classList.remove('active'));
      slideIndex = (index + slides.length) % slides.length;
      slides[slideIndex].classList.add('active');
    }

    function nextSlide() { showSlide(slideIndex + 1); }
    function prevSlide() { showSlide(slideIndex - 1); }

    showSlide(slideIndex);

    const nextBtn = document.querySelector('.next');
    const prevBtn = document.querySelector('.prev');

    if (nextBtn) nextBtn.addEventListener('click', nextSlide);
    if (prevBtn) prevBtn.addEventListener('click', prevSlide);
  </script>
</body>
</html>
