<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><a href="index.html">Snes' Foto-Stube</a></h1>
    <nav id="main-nav">
      <a href="index.html">Start</a>
      <a href="galerie.html">Galerie</a>
      <a href="about.html">Was ist das hier?</a>
      <a href="impressum.html">Impressum</a>
      <button id="toggle-darkmode">Dark Mode an/aus</button>
    </nav>
  </header>

  <main>
    <section class="gallery">
      <h2>Bildergalerie</h2>
      <div class="gallery-grid" id="gallery-grid">
        <!-- Thumbnails werden per JS generiert -->
      </div>
    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="hidden">
      <span id="close">&times;</span>
      <img id="lightbox-img" src="" alt="">
    </div>
  </main>

  <script>
    // ==============================
    // Galerie + automatische Thumbnails
    // ==============================
    const bilder = [
      "bilder/IMG_20250928_0014.jpg",
      "bilder/IMG_20250928_0020.jpg",
      "bilder/IMG_20250928_0021.jpg",
      "bilder/IMG_20250928_0022.jpg",
      "bilder/5.jpg",
      "bilder/6.jpg",
      "bilder/7.jpg",
      "bilder/8.jpg",
      "bilder/9.jpg",
      "bilder/10.jpg",
      "bilder/11.jpg",
      "bilder/12.jpg",
      "bilder/13.jpg",
      "bilder/14.jpg",
      "bilder/15.jpg",
      "bilder/16.jpg",
      "bilder/17.jpg",
      "bilder/18.jpg",
      "bilder/19.jpg",
      "bilder/20.jpg",
      "bilder/21.jpg"
    ];

    const galleryGrid = document.getElementById('gallery-grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('close');

    // Thumbnails erstellen
    bilder.forEach(src => {
      const img = document.createElement('img');
      img.classList.add('thumbnail');
      img.src = src;         // Browser skaliert die Vorschau automatisch
      img.dataset.full = src; // Originalbild für Lightbox
      img.alt = src.split('/').pop();
      galleryGrid.appendChild(img);

      img.addEventListener('click', () => {
        lightbox.classList.remove('hidden');
        lightboxImg.src = img.dataset.full;
      });
    });

    // Lightbox schließen
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox || e.target === closeBtn) {
        lightbox.classList.add('hidden');
      }
    });

    // ==============================
    // Dark Mode Toggle & Scroll Nav
    // ==============================
    const toggleBtn = document.getElementById('toggle-darkmode');
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
      });
    }

    let lastScrollTop = 0;
    const nav = document.getElementById('main-nav');
    if (nav) {
      window.addEventListener('scroll', () => {
        let st = window.pageYOffset || document.documentElement.scrollTop;
        if (st > lastScrollTop && st > 50) {
          nav.classList.add('hidden');
        } else {
          nav.classList.remove('hidden');
        }
        lastScrollTop = st <= 0 ? 0 : st;
      });
    }
  </script>
</body>
</html>
