</head>
<body>
  <header>
    <h1><a href="index.html">Snes' Foto-Stube</a></h1>
    <nav id="main-nav">
      <a href="index.html">Start</a>
      <a href="galerie.html">Galerie</a>

      <a href="kontakt.html" class="active">Kontakt</a>

        <button id="toggle-lang">EN/DE</button>
    </nav>

  <main>
    <section class="contact">
      <h2>Kontakt</h2>
      <p>Für Anfragen, Feedback oder Fragen zur Fotografie schreib mir gerne eine Nachricht:</p>

      <!-- E-Mail mit Spam-Schutz (JavaScript-Obscuring) -->
      <p>E-Mail: <span id="email">leopold.holz@gmx.de</span></p>
      <button onclick="copyEmail()" class="copy-btn">E-Mail kopieren</button>

      <!-- Alternative: Direkter Link (für Nutzer mit deaktiviertem JS) -->
      <a href="mailto:leopold.holz@gmx.de" class="email-link">Direkt E-Mail öffnen</a>

    </section>
  </main>

  <script src="script.js"></script>
  <!-- JavaScript für E-Mail-Spam-Schutz -->
  <script>
    function copyEmail() {
      const email = "leopold.holz@gmx.de";
      navigator.clipboard.writeText(email).then(() => {
        alert("E-Mail-Adresse kopiert: " + email);
      });
    }
  </script>
</body>
